{% extends "base.html" %}

{% block content %}
<h1 class="cart-title">Ваша корзина</h1>

{% if not cart_items %}
    <p style="text-align: center; color: white;">Корзина пуста.</p>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('catalog') }}" class="catalog-link">Перейти в каталог товаров</a>
    </div>
{% else %}
    <div class="cart-container">
        {% for item in cart_items %}
        <div class="cart-item-card" data-id="{{ item.id }}">
            <div class="cart-item-main">
                <img src="/static/images/{{ item.image }}" alt="{{ item.name }}">
                <div class="cart-item-name">{{ item.name }}</div>
            </div>
            <div class="cart-item-quantity" id="quantity-{{ item.id }}">{{ item.quantity }}</div>
            <div class="cart-item-actions">
                <button type="button" class="quantity-btn" onclick="updateQuantity({{ item.id }}, 'decrease')">−</button>
                <button type="button" class="remove-btn" onclick="removeFromCart({{ item.id }})">Удалить</button>
                <button type="button" class="quantity-btn" onclick="updateQuantity({{ item.id }}, 'increase')">+</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('order') }}" class="order-button">Оформить заказ</a>
    </div>
{% endif %}

<style>
    .cart-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 0 16px;
}

.cart-item-card {
    background-color: #111;
    border: 2px solid #00ff00;
    border-radius: 18px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    box-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
}

.cart-item-main {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
}

.cart-item-card img {
    width: 120px;
    height: 120px;
    border-radius: 20px;
    object-fit: cover;
    background-color: white;
    padding: 6px;
}

.cart-item-name {
    font-weight: bold;
    color: white;
    font-size: 18px;
    text-align: left;
    flex: 1;
}

.cart-item-quantity {
    color: white;
    font-size: 18px;
    font-weight: bold;
    margin: 0 12px;
}

.cart-item-actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quantity-btn, .remove-btn {
    background-color: #00ff00;
    color: black;
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.2s ease;
    min-width: 42px;
}

.quantity-btn:hover, .remove-btn:hover {
    background-color: #00cc00;
}

.remove-btn {
    padding: 8px 20px;
}

.order-button {
    background-color: #00ff00;
    color: black;
    font-family: 'activistka_wide', sans-serif;
    font-size: 20px;
    font-weight: bold;
    padding: 14px 32px;
    border: none;
    border-radius: 14px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(0,255,0,0.3);
    transition: background-color 0.3s ease, transform 0.2s ease;
}

.order-button:hover {
    background-color: #00cc00;
    transform: translateY(-2px);
    color: black;
}

.order-button:active {
    background-color: #009900;
    color: black;
}

@media (max-width: 480px) {
    .cart-item-card {
        flex-direction: column;
        align-items: flex-start;
    }

    .cart-item-main {
        flex-direction: row;
        align-items: center;
    }

    .cart-item-actions {
        margin-top: 8px;
        justify-content: flex-start;
        flex-wrap: wrap;
    }

    .cart-item-card img {
        width: 100px;
        height: 100px;
    }
}

</style>

<script>
    function updateOrderButtonVisibility() {
        const orderButton = document.querySelector('.order-button');
        const items = document.querySelectorAll('.cart-item-card');
        if (orderButton) {
            if (items.length === 0) {
                orderButton.classList.add('fade-out');
                setTimeout(() => orderButton.remove(), 500);
            } else {
                orderButton.classList.remove('fade-out');
            }
        }
    }

    function removeFromCart(productId) {
        fetch(`/remove_from_cart_ajax/${productId}`, {
            method: "POST"
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const itemElement = document.querySelector(`.cart-item-card[data-id="${productId}"]`);
                if (itemElement) {
                    itemElement.classList.add("fade-out");
                    setTimeout(() => {
                        itemElement.remove();
                        updateOrderButtonVisibility();
                        if (document.querySelectorAll('.cart-item-card').length === 0) {
                            document.querySelector('.cart-container').innerHTML = `
                                <p style="text-align: center; color: white;">Корзина пуста.</p>
                                <div style="text-align: center; margin-top: 20px;">
                                    <a href="{{ url_for('catalog') }}" class="catalog-link">Перейти в каталог товаров</a>
                                </div>
                            `;
                        }
                    }, 400);
                }
                document.querySelectorAll('.cart-count').forEach(el => el.textContent = data.cart_count);
                showToast("Товар удалён из корзины");
            }
        });
    }

    function updateQuantity(productId, action) {
        fetch(`/update_cart_quantity_ajax/${productId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ action: action })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                if (data.new_quantity > 0) {
                    document.getElementById(`quantity-${productId}`).textContent = data.new_quantity;
                    showToast(action === 'increase' ? "Добавлен ещё один товар" : "Уменьшено количество товара");
                } else {
                    removeFromCart(productId);
                }
                document.querySelectorAll('.cart-count').forEach(el => el.textContent = data.cart_count);
                updateOrderButtonVisibility();
            }
        });
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    document.addEventListener('DOMContentLoaded', updateOrderButtonVisibility);
</script>

<div id="toast" class="toast"></div>
{% endblock %}
