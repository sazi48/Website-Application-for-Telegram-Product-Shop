{% extends "base.html" %}

{% block content %}
<h1 class="cart-title">Ваша корзина</h1>

{% if not cart_items %}
    <p style="text-align: center; color: white;">Корзина пуста.</p>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('catalog') }}" class="catalog-link">Перейти в каталог товаров</a>
    </div>
{% else %}
    <div class="cart-container">
        {% for item in cart_items %}
        <div class="cart-item-card" data-id="{{ item.id }}">
            <img src="/static/images/{{ item.image }}" alt="{{ item.name }}">
            <div class="cart-item-name">{{ item.name }}</div>
            <div class="cart-item-quantity" id="quantity-{{ item.id }}">{{ item.quantity }}</div>
            <div class="cart-item-actions">
                <button type="button" class="quantity-btn" onclick="updateQuantity({{ item.id }}, 'decrease')">−</button>
                <button type="button" class="remove-btn" onclick="removeFromCart({{ item.id }})">Удалить</button>
                <button type="button" class="quantity-btn" onclick="updateQuantity({{ item.id }}, 'increase')">+</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="{{ url_for('order') }}" class="order-button">Оформить заказ</a>
    </div>
{% endif %}

<style>
    .cart-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 0 16px;
    }

    .cart-item-card {
        background-color: #1a1a1a;
        border: 1.5px solid #00ff00;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        box-shadow: 0 0 4px #2ecc71, 0 0 8px #00ff00;
        transition: all 0.3s ease;
    }

    .cart-item-card img {
        width: 60px;
        height: 60px;
        border-radius: 10px;
        object-fit: cover;
        margin-right: 12px;
    }

    .cart-item-name {
        flex-grow: 1;
        font-weight: bold;
        color: white;
        font-size: 16px;
    }

    .cart-item-quantity {
        color: white;
        margin: 0 10px;
    }

    .cart-item-actions {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .quantity-btn, .remove-btn {
        background-color: #2e2e2e;
        color: white;
        border: 1px solid #00ff00;
        font-weight: bold;
        font-size: 16px;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .quantity-btn:hover, .remove-btn:hover {
        background-color: #444;
        transform: translateY(-1px);
    }

    .order-button {
        background-color: #1e1e1e;
        color: #00ff00;
        font-family: 'activistka_wide', sans-serif;
        font-size: 18px;
        font-weight: bold;
        padding: 12px 28px;
        border: 1.5px solid #00ff00;
        border-radius: 10px;
        text-decoration: none;
        box-shadow: 0 0 5px #2ecc71, 0 0 10px #00ff00;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .order-button:hover {
        background-color: #00ff00;
        transform: translateY(-2px);
        color: black;
    }

    .order-button:active {
        background-color: #161616;
        color: #36ff75;
    }

    .catalog-link {
        display: inline-block;
        background-color: #1e1e1e;
        color: #00ff00;
        padding: 10px 20px;
        border: 1.5px solid #00ff00;
        border-radius: 10px;
        font-weight: bold;
        text-decoration: none;
        font-size: 16px;
        box-shadow: 0 0 5px #2ecc71, 0 0 10px #00ff00;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .catalog-link:hover {
        background-color: #00ff00;
        transform: translateY(-2px);
        color: black;
    }

    .fade-out {
        opacity: 0;
        transition: opacity 0.4s ease-out;
    }

    @media (max-width: 480px) {
        .cart-item-card {
            flex-direction: column;
            align-items: flex-start;
        }

        .cart-item-actions {
            margin-top: 8px;
            justify-content: flex-start;
        }

        .cart-item-name {
            margin-top: 6px;
        }
    }

    .toast {
        visibility: hidden;
        min-width: 260px;
        margin-left: -130px;
        background-color: #121212;
        color: #00ff00;
        text-align: center;
        border-radius: 12px;
        padding: 14px 24px;
        position: fixed;
        z-index: 9999;
        left: 50%;
        bottom: 40px;
        font-size: 16px;
        border: 2px solid #00ff00;
        box-shadow: 0 0 6px #00ff00, 0 0 12px #00ff00;
        font-weight: bold;
        opacity: 0;
        transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .toast.show {
        visibility: visible;
        opacity: 1;
        transform: translateY(-10px);
    }
</style>

<script>
    function updateOrderButtonVisibility() {
        const orderButton = document.querySelector('.order-button');
        const items = document.querySelectorAll('.cart-item-card');
        if (orderButton) {
            if (items.length === 0) {
                orderButton.classList.add('fade-out');
                setTimeout(() => orderButton.remove(), 500);
            } else {
                orderButton.classList.remove('fade-out');
            }
        }
    }

    function removeFromCart(productId) {
        fetch(`/remove_from_cart_ajax/${productId}`, {
            method: "POST"
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const itemElement = document.querySelector(`.cart-item-card[data-id="${productId}"]`);
                if (itemElement) {
                    itemElement.classList.add("fade-out");
                    setTimeout(() => {
                        itemElement.remove();
                        updateOrderButtonVisibility();
                        if (document.querySelectorAll('.cart-item-card').length === 0) {
                            document.querySelector('.cart-container').innerHTML = `
                                <p style="text-align: center; color: white;">Корзина пуста.</p>
                                <div style="text-align: center; margin-top: 20px;">
                                    <a href="{{ url_for('catalog') }}" class="catalog-link">Перейти в каталог товаров</a>
                                </div>
                            `;
                        }
                    }, 400);
                }
                document.querySelectorAll('.cart-count').forEach(el => el.textContent = data.cart_count);
                showToast("Товар удалён из корзины");
            }
        });
    }

    function updateQuantity(productId, action) {
        fetch(`/update_cart_quantity_ajax/${productId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ action: action })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                if (data.new_quantity > 0) {
                    document.getElementById(`quantity-${productId}`).textContent = data.new_quantity;
                    showToast(action === 'increase' ? "Добавлен ещё один товар" : "Уменьшено количество товара");
                } else {
                    removeFromCart(productId);
                }
                document.querySelectorAll('.cart-count').forEach(el => el.textContent = data.cart_count);
                updateOrderButtonVisibility();
            }
        });
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    document.addEventListener('DOMContentLoaded', updateOrderButtonVisibility);
</script>

<!-- Всплывающее уведомление -->
<div id="toast" class="toast"></div>
{% endblock %}
