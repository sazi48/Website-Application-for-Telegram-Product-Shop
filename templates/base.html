<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог HeatMe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background-color: #333;
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #000;
        z-index: 9999;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .toast.show {
        opacity: 1;
        transform: translateY(0);
    }

    .cart-item-card {
        background-color: #111;
        padding: 16px;
        border-radius: 12px;
        margin-bottom: 16px;
        transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .cart-item-card:hover {
        box-shadow: 0 0 20px rgba(0, 255, 174, 0.5);
        transform: translateY(-4px) scale(1.02);
    }

    .cart-item-card.fade-out {
        opacity: 0;
        transform: translateX(50px);
        transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .cart-icon {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background-color: #111;
        border: 1px solid #00ff00;
        color: #fff;
        padding: 10px 16px;
        border-radius: 50px;
        text-decoration: none;
        font-weight: bold;
        font-size: 16px;
        box-shadow: 0 0 12px rgba(0, 195, 126, 0.6);
        transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .cart-icon:hover {
        background-color: #00ff00;
        transform: scale(1.08);
    }

    .cart-icon-pop {
        animation: cart-pop 0.3s ease;
    }

    @keyframes cart-pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }
    .logo-img {
      max-height: 40px;         /* ограничение по высоте, чтобы не выходила за пределы шапки */
      height: auto;
      width: auto;
      max-width: 100%;          /* чтобы не вылезала за контейнер */
      display: block;
    }
    .logo a {
      display: flex;
      align-items: center;
    }
    .site-header {
        position: relative;
        height: 64px;
        background-color: #1e1e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        z-index: 10;
    }

    .logo-center {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }

    .logo-img {
        max-height: 40px;
        height: auto;
        width: auto;
        max-width: 100%;
        display: block;
    }

    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-center">
            <a href="/">
                <img src="/static/images/logo.jpg" alt="HeatMe" class="logo-img">
            </a>
        </div>
    </header>

    {% block content %}{% endblock %}

    {% if request.endpoint not in ['cart', 'order_confirmation', 'order'] %}
    <a class="cart-icon" href="{{ url_for('cart') }}">
        🛒 <span class="cart-count">{{ cart_count }}</span>
    </a>
    {% endif %}
</body>
</html>
