{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Поиск товаров..." class="search-bar">
        <i class="search-icon fas fa-search"></i> <!-- Иконка поиска -->
    </div>

    <div class="product-container">
        {% for product in products %}
        {% set quantity = cart.get(product.id|string, 0) %}
        <div class="product{% if quantity > 0 %} selected{% endif %}" data-product-id="{{ product.id }}" data-name="{{ product.name | lower }}">
            <img src="{{ url_for('static', filename='images/' + product.image) }}" alt="{{ product.name }}">

            <div class="product-info">
                <p class="product-name">{{ product.name }}</p>
                <p class="description">{{ product.description }}</p>
            </div>

            <div class="product-action">
                {% if quantity > 0 %}
                <div class="quantity-controls">
                    <button class="neon-btn" onclick="changeQuantity({{ product.id }}, -1)">-</button>
                    <input type="number" min="1" value="{{ quantity }}" onchange="setQuantity({{ product.id }}, this.value)">
                    <button class="neon-btn" onclick="changeQuantity({{ product.id }}, 1)">+</button>
                </div>
                {% else %}
                <button class="add-btn" onclick="setQuantity({{ product.id }}, 1)">Добавить</button>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Подключение Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
    .search-container {
        position: relative;
        max-width: 600px;
        width: 60%;
        margin: 0 auto 24px;
    }

    .search-bar {
        display: block;
        width: 100%;
        padding: 12px 16px 12px 36px; /* Место для иконки */
        font-size: 16px;
        border-radius: 30px;
        border: 1px solid #00c37e;
        background-color: #1e1e1e;
        color: #00ffae;
        box-shadow: 0 0 10px rgba(0, 195, 126, 0.3);
        transition: box-shadow 0.3s ease, transform 0.2s ease;
    }

    .search-bar:focus {
        outline: none;
        box-shadow: 0 0 15px rgba(0, 255, 174, 0.6);
        transform: scale(1.01);
    }

    .search-icon {
        position: absolute;
        top: 50%;
        left: 10px;
        transform: translateY(-50%);
        font-size: 18px;
        color: #00ffae;
        transition: transform 0.3s ease, animation 0.3s ease;
    }

    .search-bar:focus + .search-icon {
        transform: translateY(-50%) scale(1.2);
        animation: pulse 1.5s infinite; /* Добавлен пульсирующий эффект */
    }

    @keyframes pulse {
        0% {
            transform: translateY(-50%) scale(1.2);
        }
        50% {
            transform: translateY(-50%) scale(1.4);
        }
        100% {
            transform: translateY(-50%) scale(1.2);
        }
    }

    @media (max-width: 600px) {
        .search-bar {
            font-size: 15px;
            padding: 10px 14px 10px 30px; /* Уменьшаем padding на мобильных устройствах */
        }
    }

    @media (max-width: 400px) {
        .search-bar {
            padding: 8px 12px 8px 24px; /* Еще больше уменьшаем padding на маленьких устройствах */
        }
    }

    .product {
        background-color: #111;
        padding: 16px;
        border-radius: 12px;
        transition: box-shadow 0.3s ease, transform 0.3s ease, border 0.3s ease, background-color 0.3s ease;
    }

    .product:hover {
        box-shadow: 0 0 20px rgba(0, 255, 174, 0.5);
        transform: translateY(-4px) scale(1.02);
    }

    .product.selected {
        border: 2px solid #00ffae;
        box-shadow: 0 0 15px rgba(0, 255, 174, 0.6);
        background-color: #151515;
    }

    .add-btn,
    .neon-btn {
        background-color: #00c37e;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        box-shadow: 0 0 10px rgba(0, 195, 126, 0.6);
    }

    .add-btn:hover,
    .neon-btn:hover {
        background-color: #00a86b;
        transform: scale(1.05);
    }

    .quantity-controls {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .quantity-controls input {
        width: 50px;
        text-align: center;
        border-radius: 6px;
        padding: 6px;
        font-size: 14px;
        border: 1px solid #00c37e;
        background-color: #1e1e1e;
        color: #00ffae;
        box-shadow: 0 0 8px rgba(0, 195, 126, 0.4);
        transition: box-shadow 0.2s ease;
    }

    .quantity-controls input:focus {
        outline: none;
        box-shadow: 0 0 12px rgba(0, 255, 174, 0.8);
    }

    .added-animation {
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }
</style>

<script>
    document.getElementById('search-input').addEventListener('input', function () {
        const value = this.value.toLowerCase();
        document.querySelectorAll('.product').forEach(card => {
            const name = card.getAttribute('data-name');
            card.style.display = name.includes(value) ? '' : 'none';
        });
    });

    function updateCart(productId, quantity) {
        fetch(`/update_cart/${productId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({quantity: quantity})
        }).then(res => res.json())
        .then(data => {
            if (data.success) {
                document.querySelectorAll('.cart-count').forEach(el => el.textContent = data.cart_count);
                const productCard = document.querySelector(`[data-product-id="${productId}"]`);
                const actionContainer = productCard.querySelector('.product-action');

                if (quantity > 0) {
                    productCard.classList.add('selected');
                    const input = productCard.querySelector('input');
                    if (input) {
                        input.value = quantity;
                    } else {
                        actionContainer.innerHTML = `
                            <div class="quantity-controls">
                                <button class="neon-btn" onclick="changeQuantity(${productId}, -1)">-</button>
                                <input type="number" min="1" value="${quantity}" onchange="setQuantity(${productId}, this.value)">
                                <button class="neon-btn" onclick="changeQuantity(${productId}, 1)">+</button>
                            </div>
                        `;
                    }
                } else {
                    productCard.classList.remove('selected');
                    actionContainer.innerHTML = `
                        <button class="add-btn added-animation" onclick="setQuantity(${productId}, 1)">Добавить</button>
                    `;
                }

                const icon = document.querySelector('.cart-icon');
                if (icon) {
                    icon.classList.add('cart-icon-pop');
                    setTimeout(() => icon.classList.remove('cart-icon-pop'), 300);
                }
            }
        });
    }

    function changeQuantity(productId, delta) {
        const input = document.querySelector(`[data-product-id="${productId}"] input`);
        let newVal = parseInt(input.value) + delta;
        if (newVal < 1) newVal = 0;
        updateCart(productId, newVal);
    }

    function setQuantity(productId, quantity) {
        quantity = parseInt(quantity);
        if (!isNaN(quantity) && quantity >= 1) {
            updateCart(productId, quantity);
        }
    }
</script>
{% endblock %}
