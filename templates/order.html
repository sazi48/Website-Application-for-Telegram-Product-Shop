{% extends "base.html" %}

{% block content %}
<div class="order-container">
    <h2 class="order-title">Placing an order</h2>
    <form method="POST" action="{{ url_for('order') }}" class="checkout-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label for="address">Delivery address</label>
            <input type="text" id="address" name="address" required placeholder="City, street, house">
        </div>
        <div class="form-group">
            <label for="zavedenie">Name of the establishment</label>
            <input type="text" id="zavedenie" name="zavedenie" required placeholder="Your establishment">
        </div>
        <div class="form-group">
            <label for="telegramuser">Telegram user</label>
            <input type="text" id="telegramuser" name="telegramuser" required placeholder="Your Telegram user: @...">
        </div>
        <div class="form-group">
            <label for="phone">Telephone</label>
            <input type="tel"
                   id="phone"
                   name="phone"
                   required
                   placeholder="+1 (___) ___-__-__"
                   minlength="11"
                   maxlength="12">
        </div>
        <button type="submit" class="confirm-btn">Confirm your order</button>
    </form>

    <div style="height: 200px;"></div>
</div>

<style>
    .order-container {
        max-width: 500px;
        margin: 0 auto;
        background-color: #1d1d1d;
        padding: 30px 20px;
        border-radius: 12px;
        border: 1.5px solid #00ff00;
        box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
    }

    .order-title {
        text-align: center;
        color: white;
        margin-bottom: 24px;
        font-size: 26px;
        font-weight: bold;
    }

    .checkout-form .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
    }

    .checkout-form label {
        color: #ccc;
        margin-bottom: 8px;
        font-size: 14px;
    }

    .checkout-form input {
        padding: 10px 12px;
        border: 3px solid white;
        border-radius: 8px;
        background-color: #121212;
        color: white;
        font-size: 16px;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
    }

    .checkout-form input:focus {
        border-color: white;
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.8);
        outline: none;
    }

    .confirm-btn {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        font-weight: bold;
        background-color: #1d1d1d;
        color: #00ff00;
        border: none;
        border: 1px solid #00ff00;
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        font-family: 'Inter', sans-serif;
        box-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
    }

    .confirm-btn:hover {
        background-color: #00ff00;
        color: black;
        transform: scale(1.03);
        box-shadow: 0 0 16px rgba(0, 255, 136, 0.6);
    }

    .confirm-btn:active {
        background-color: #00ff00;
        transform: scale(0.98);
    }

    @media (max-width: 480px) {
        .order-container {
            padding: 20px 16px;
        }

        .order-title {
            font-size: 22px;
        }

        .order-container {
            padding-bottom: 200px;
        }
    }
</style>

<script>
    document.querySelectorAll('input, textarea').forEach(el => {
        el.addEventListener('focus', () => {
            setTimeout(() => {
                el.scrollIntoView({behavior: 'smooth', block: 'center'});
            }, 300);
        });
    });
</script>

{% endblock %}
