{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4">Оформление заказа</h2>
    <form method="POST" action="{{ url_for('order') }}" class="checkout-form">
        <div class="form-group mb-3">
            <label for="name">Имя</label>
            <input type="text" id="name" name="name" required placeholder="Введите ваше имя">
        </div>
        <div class="form-group mb-3">
            <label for="address">Адрес доставки</label>
            <input type="text" id="address" name="address" required placeholder="Город, улица, дом...">
        </div>
        <div class="form-group mb-3">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" required placeholder="+7 (___) ___-__-__">
        </div>
        <button type="submit" class="add-btn">Подтвердить заказ</button>
    </form>
</div>
{% endblock %}
